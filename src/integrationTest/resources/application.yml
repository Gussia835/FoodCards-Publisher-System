spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
  flyway:
    enabled: false
  liquibase:
    enabled: false

grpc:
  server:
    port: 0

receiver:
  datasource:
    pom:
      driver-class-name: org.postgresql.Driver

    gru:
      url: jdbc:h2:mem:gru_mock;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      password:
      driver-class-name: org.h2.Driver

app:
  filespaths:
    process-dir: /tmp/test-incoming
    target-dir: /tmp/test-target